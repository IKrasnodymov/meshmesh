<!doctype html>
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeshMesh</title>
<meta name="description" content="" data-i18n-content="meta.description">
<meta property="og:title" content="" data-i18n-content="meta.ogTitle">
<meta property="og:description" content="" data-i18n-content="meta.ogDescription">
<meta property="og:image" content="https://ikrasnodymov.github.io/meshmesh/img/og.png">
<meta name="theme-color" content="#080c11">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<script type="module" src="https://unpkg.com/esp-web-tools@10.4.0/dist/web/install-button.js?module"></script>
<style>
:root{color-scheme:dark;--bg:#080c11;--bg2:#0c1218;--card:#131a22;--hi:#1c2835;--line:#2a3542;--ink:#e4e9ee;--dim:#8d99a6;--faint:#56626e;--accent:#1fc2ae;--deep:#14524b;--ok:#4cc26b;--warn:#e9b13b;--info:#4f9df7;--violet:#a78bfa;--pink:#f472b6;--r:16px}
*{box-sizing:border-box}
[hidden]{display:none!important} /* .btn and other display rules must not show hidden elements */
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Arabic","PingFang SC","Hiragino Sans","Apple SD Gothic Neo","Microsoft YaHei","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html.loading body{visibility:hidden} /* until the language is applied */
:lang(zh),:lang(ja),:lang(ko){word-break:keep-all;line-break:strict}
:lang(ar) .kicker,:lang(ar) h1,:lang(ar) h2,:lang(ar) h3{letter-spacing:0} /* spacing breaks the joined letters */
:lang(zh) h1,:lang(ja) h1,:lang(ko) h1,:lang(zh) h2,:lang(ja) h2,:lang(ko) h2{letter-spacing:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
img{display:block;max-width:100%}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
section{padding:96px 0}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,40px);font-weight:800}
.lead{color:var(--dim);font-size:18px;margin:12px 0 0;max-width:620px}
.kicker{font:500 13px/1 "JetBrains Mono",monospace;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 22px;border-radius:12px;font-weight:600;font-size:16px;border:1px solid var(--line);color:var(--ink);background:var(--card);cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{text-decoration:none;background:var(--hi);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04201c}
.btn.primary:hover{background:#2fd6c1}
.btn svg{width:20px;height:20px}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(8,12,17,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(42,53,66,.6)}
header .wrap{display:flex;align-items:center;gap:28px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--ink)}
.logo:hover{text-decoration:none}
.logo img{width:28px;height:28px}
nav{display:flex;gap:22px;margin-inline-start:auto}
nav a{color:var(--dim);font-size:15px;font-weight:500}
nav a:hover{color:var(--ink);text-decoration:none}
.lang{position:relative;display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;color:var(--dim)}
.lang svg{position:absolute;inset-inline-start:9px;width:16px;height:16px;pointer-events:none}
.lang select{appearance:none;-webkit-appearance:none;background:none;border:0;color:var(--ink);font:600 13px Inter,system-ui,sans-serif;padding:7px 12px;padding-inline-start:30px;cursor:pointer;max-width:150px}
.lang select option{background:var(--card);color:var(--ink)}
.gh{display:flex;color:var(--dim)}
.gh svg{width:22px;height:22px}
.gh:hover{color:var(--ink)}
/* hero */
.hero{padding:72px 0 88px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-200px -100px auto auto;width:900px;height:900px;background:radial-gradient(circle,rgba(31,194,174,.16),transparent 60%);pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;position:relative}
.hero h1{font-size:clamp(40px,6vw,64px);font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{font-size:19px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.cta-more{display:none} /* the header menu links to the features; shown when the menu is hidden */
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:40px;color:var(--dim);font-size:14px}
[dir=rtl] .news i,[dir=rtl] .lb .nav svg{transform:scaleX(-1)}
.news{display:flex;align-items:center;gap:14px;max-width:560px;margin-top:24px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.4;transition:border-color .15s}.news:hover{border-color:var(--accent)}.news .t{width:34px;height:34px;border-radius:10px;background:var(--deep);color:var(--accent);display:grid;place-items:center;flex:none}.news .t svg{width:20px;height:20px}.news>span{flex:1}.news i{font-style:normal;color:var(--accent)}
.facts b{display:block;color:var(--ink);font-size:22px;font-weight:700}
/* devices */
.stage{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:440px}
.m9{width:min(400px,100%);background:linear-gradient(160deg,#2b333d,#171c22);border-radius:30px;padding:20px 20px 18px;box-shadow:0 40px 80px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);border:1px solid #333d48}
.m9 .screen{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#000;border:3px solid #050709;position:relative}
.m9 .screen img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s}
.m9 .screen img.on{opacity:1}
.keys{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:16px}
.keys i{height:15px;border-radius:5px;background:#0e1216;box-shadow:inset 0 -2px 0 rgba(255,255,255,.04)}
.keys i.w{grid-column:span 4}
.heltec{position:absolute;left:-30px;bottom:-56px;width:200px;background:linear-gradient(160deg,#1d2a3a,#0f1822);border-radius:12px;padding:12px;border:1px solid #2a3a4c;box-shadow:0 24px 50px -10px rgba(0,0,0,.8);transform:rotate(-6deg)}
.heltec .oled{aspect-ratio:2/1;background:#000;border-radius:3px;overflow:hidden;border:2px solid #05080b}
.heltec .oled img{width:100%;height:100%}
.heltec .lbl{display:flex;justify-content:space-between;margin-top:8px;font:500 9px "JetBrains Mono",monospace;color:#6c7f94}
.gat{position:absolute;right:-34px;bottom:-40px;width:184px;background:linear-gradient(160deg,#2a2f37,#14181d);border-radius:14px;padding:12px 12px 10px;border:1px solid #3a424d;box-shadow:0 24px 50px -10px rgba(0,0,0,.8);transform:rotate(5deg)}
.gat .oled{aspect-ratio:2/1;background:#000;border-radius:3px;overflow:hidden;border:2px solid #05080b}
.gat .oled img{width:100%;height:100%}
.gat .pad{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:10px}
.gat .joy{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#56606c,#2a3038 70%);border:1px solid #4a535e;box-shadow:inset 0 -2px 3px rgba(0,0,0,.5)}
.gat .back{width:14px;height:14px;border-radius:50%;background:#3a424d;border:1px solid #4f5965}
.gat .lbl{display:flex;justify-content:space-between;margin-top:8px;font:500 9px "JetBrains Mono",monospace;color:#7d8794}
.dots{display:flex;gap:8px;justify-content:center;margin-top:18px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer}
.dots button.on{background:var(--accent);width:22px;border-radius:4px}
/* how */
.how{background:var(--bg2);border-block:1px solid #141c25}
.diagram{margin:48px 0 40px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.diagram svg{width:100%;height:auto;display:block}
.diagram .vert{display:none;max-width:340px;margin:0 auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.step .n{width:34px;height:34px;border-radius:10px;background:var(--deep);color:var(--accent);font-weight:800;display:grid;place-items:center;margin-bottom:16px}
.step h3{font-size:18px;margin-bottom:6px}
.step p{margin:0;color:var(--dim);font-size:15px}
/* features */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:zoom-in;transition:transform .2s,border-color .2s;display:flex;flex-direction:column;text-align:start;padding:0;color:inherit;font:inherit}
.feat:hover{transform:translateY(-3px);border-color:#3a4a5c}
.feat .shot{background:#000;aspect-ratio:4/3;position:relative;overflow:hidden}
.feat .shot img{width:100%;height:100%;object-fit:cover}
.feat .shot.oled{display:grid;place-items:center;background:#05080b}
.feat .shot.oled img{width:86%;height:auto;object-fit:contain;border:1px solid #1d252e}
.feat .shot.phone{background:linear-gradient(160deg,#0f2a28,#0b1117);display:flex;justify-content:center;align-items:flex-start;padding-top:22px}
.feat .shot.phone img{width:56%;height:auto;object-fit:contain;border-radius:18px 18px 0 0;border:5px solid #222a33;border-bottom:0}
.feat .count{position:absolute;right:10px;bottom:10px;background:rgba(8,12,17,.85);color:var(--ink);font:500 12px "JetBrains Mono",monospace;padding:4px 8px;border-radius:7px;border:1px solid var(--line)}
.feat .txt{padding:18px 20px 22px}
.feat h3{font-size:18px;display:flex;align-items:center;gap:10px}
.feat h3 .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.feat h3 .ic svg{width:16px;height:16px}
.feat p{margin:6px 0 0;color:var(--dim);font-size:15px}
/* boards */
.boards{margin-top:36px}
.boards h4{margin:24px 0 10px;font:600 13px Inter,sans-serif;color:var(--dim);display:flex;align-items:center;gap:8px}
.boards h4:first-child{margin-top:0}
.boards h4 .tag{margin-inline-start:0}
.boards .bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.board{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);font:inherit;text-align:start;transition:border-color .15s,background .15s}
.board:hover{border-color:#3a4a5c}
.board.on{border-color:var(--accent);background:#0f2522}
.board .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);flex:none;position:relative}
.board.on .radio{border-color:var(--accent)}
.board.on .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.board b{font-weight:600;font-size:15px;display:block}
.board small{color:var(--faint);font-size:12.5px}
.tag{margin-inline-start:auto;font:600 11px Inter,sans-serif;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.ok{background:rgba(76,194,107,.14);color:var(--ok)}
.tag.cm{background:rgba(233,177,59,.12);color:var(--warn)}
/* install */
.install{background:var(--bg2);border-block:1px solid #141c25}
.flash{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.panel h3{font-size:20px;margin-bottom:18px}
.panel ol{margin:0;padding:0;list-style:none;counter-reset:s}
.panel ol li{counter-increment:s;display:flex;gap:14px;margin-bottom:16px;color:var(--dim)}
.panel ol li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:8px;background:var(--hi);color:var(--ink);font-weight:700;font-size:13px;display:grid;place-items:center}
.panel ol li b{color:var(--ink);font-weight:600}
.chosen{display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
.chosen b{display:block}
.chosen small{color:var(--dim)}
.note{font-size:14px;color:var(--dim);padding:12px 14px;border-radius:10px;background:rgba(79,157,247,.08);border:1px solid rgba(79,157,247,.2);margin-top:16px}
.note.warn{background:rgba(233,177,59,.08);border-color:rgba(233,177,59,.25)}
.note.ok{background:rgba(31,194,174,.08);border-color:rgba(31,194,174,.3)}
.note b{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
esp-web-install-button{display:inline-block}
.unsup{color:var(--warn);font-size:15px}
.fwlang{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.fwlang label{color:var(--ink);font-weight:600;font-size:15px}
.fwlang select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:500 15px Inter,system-ui,sans-serif;padding:8px 10px}
.fwlang small{color:var(--faint);font-size:13px;flex-basis:100%}
/* docs */
.docs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.doc{display:block;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);transition:border-color .15s,transform .15s}
.doc:hover{text-decoration:none;border-color:#3a4a5c;transform:translateY(-2px)}
.doc b{display:block;margin-bottom:4px}
.doc span{color:var(--dim);font-size:14px}
footer{padding:40px 0 56px;color:var(--faint);font-size:14px;border-top:1px solid #141c25}
footer .wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--dim)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(3,5,8,.97);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lb.open{display:flex}
.lb figure{margin:0;max-width:min(1000px,100%);display:flex;flex-direction:column;align-items:center}
.lb img{max-height:72vh;width:auto;max-width:100%;border-radius:10px;border:1px solid var(--line);image-rendering:auto}
.lb img.px{image-rendering:pixelated}
.lb figcaption{margin-top:18px;text-align:center;max-width:640px}
.lb figcaption b{font-size:18px;display:block}
.lb figcaption span{color:var(--dim)}
.lb .thumbs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;justify-content:center;max-width:100%}
.lb .thumbs button{width:72px;height:54px;border-radius:7px;border:2px solid transparent;padding:0;background:#000;cursor:pointer;overflow:hidden;opacity:.55}
.lb .thumbs button.on{border-color:var(--accent);opacity:1}
.lb .thumbs img{width:100%;height:100%;object-fit:cover;border:0;border-radius:0;max-height:none}
.lb .x,.lb .nav{position:absolute;background:var(--card);border:1px solid var(--line);color:var(--ink);width:46px;height:46px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.lb .x{top:20px;right:20px}
.lb .nav{top:50%;transform:translateY(-50%)}
.lb .prev{left:20px}.lb .next{right:20px}
.lb svg{width:20px;height:20px}
@media (max-width:960px){
 .hero .wrap{grid-template-columns:1fr}
 .stage{min-height:0;margin:20px auto 0;padding-bottom:30px;width:min(400px,100%)} /* Heltec and GAT562 sit at the M9's corners */
 .heltec{left:-110px;bottom:-40px}
 .gat{right:-110px;bottom:-30px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .flash{grid-template-columns:1fr}
 .docs{grid-template-columns:repeat(2,1fr)}
 nav{display:none}
 .cta-more{display:inline-flex}
 .lang{margin-inline-start:auto}
}
@media (max-width:760px){.heltec{left:-70px}.gat{right:-70px}}
@media (max-width:620px){
 .wrap{padding:0 16px}
 section{padding:64px 0}
 .hero{padding:40px 0 56px}
 .grid,.steps,.docs{grid-template-columns:1fr}
 .heltec{width:140px;left:-6px;bottom:-10px}
 .gat{width:128px;right:-6px;bottom:-22px;padding:8px 8px 7px}
 .gat .pad{gap:14px;margin-top:6px}.gat .joy{width:20px;height:20px}.gat .back{width:10px;height:10px}
 .cta-apk{order:-1;background:var(--accent);border-color:var(--accent);color:#04201c}
 .btn.primary.cta-install{background:var(--card);border-color:var(--line);color:var(--ink)}
 .lb .nav{display:none}
 .diagram .horiz{display:none}
 .diagram .vert{display:block}
 .facts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
 .panel{padding:20px}
 .boards .bg{grid-template-columns:1fr 1fr;gap:8px}
 .board{padding:12px;gap:10px}
 .board b{font-size:14px}
 .board .radio{display:none}
}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <a class="logo" href="#"><img src="img/icon.svg" alt="">MeshMesh</a>
  <nav>
   <a href="#how"><span data-i18n="nav.how"></span></a>
   <a href="#features"><span data-i18n="nav.features"></span></a>
   <a href="#install"><span data-i18n="nav.install"></span></a>
   <a href="#docs"><span data-i18n="nav.docs"></span></a>
  </nav>
  <label class="lang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><select id="siteLang" data-i18n-aria="lang.site"></select></label>
  <a class="gh" href="https://github.com/IKrasnodymov/meshmesh" aria-label="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.7 5.4-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg></a>
 </div>
</header>

<main>
<section class="hero">
 <div class="wrap">
  <div>
   <div class="kicker">LoRa · MeshCore · ESP32 · nRF52</div>
   <h1 data-i18n="hero.title"></h1>
   <p class="lead" data-i18n="hero.lead"></p>
   <div class="cta">
    <a class="btn primary cta-install" href="#install"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg><span data-i18n="cta.install"></span></a>
    <a class="btn cta-apk" href="app/meshmesh.apk" download><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 9.48l1.84-3.18a.38.38 0 0 0-.66-.38l-1.86 3.22a11.4 11.4 0 0 0-9.84 0L5.22 5.92a.38.38 0 0 0-.66.38L6.4 9.48A10.8 10.8 0 0 0 1 18h22a10.8 10.8 0 0 0-5.4-8.52ZM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5Zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5Z"/></svg><span data-i18n="cta.apk"></span></a>
    <a class="btn cta-more" href="#features"><span data-i18n="cta.more"></span></a>
   </div>
   <a class="news" href="#features"><b class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M9 18h6l1-6H8zM10 12V9l-2-2 2-1V3h4v3l2 1-2 2v3"/></svg></b><span data-i18n="news.tour"></span><i>→</i></a>
   <div class="facts">
    <div><b>14</b><span data-i18n="facts.boards"></span></div>
    <div><b>MeshCore</b><span data-i18n="facts.radio"></span></div>
    <div><b>15</b><span data-i18n="facts.ui"></span></div>
    <div><b>MIT</b><span data-i18n="facts.license"></span></div>
   </div>
  </div>

function render(){
 const root=document.documentElement;root.lang=lang;root.dir=RTL.includes(lang)?'rtl':'ltr';
 document.getElementById('siteLang').value=lang;
 for(const e of document.querySelectorAll('[data-i18n]'))e.innerHTML=L(e.dataset.i18n);
 for(const e of document.querySelectorAll('[data-i18n-content]'))e.content=L(e.dataset.i18nContent);
 for(const e of document.querySelectorAll('[data-i18n-aria]'))e.setAttribute('aria-label',L(e.dataset.i18nAria));
 document.querySelectorAll('[data-shot]').forEach(i=>{i.dataset.f='';i.src=shotSrc(i.dataset.shot)});
 document.getElementById('features-grid').innerHTML=FEATURES.map((f,i)=>{
  const s=f.shots[0];
  const cls=f.oled?'shot oled':f.phone?'shot phone':'shot';
  return `<button class="feat" data-f="${i}"><div class="${cls}">${s?`<img loading="lazy" src="${shotSrc(s,f.phone)}" ${shotFallback} alt="${L('f.'+f.id+'.t')}">`:''}${f.shots.length>1?`<span class="count">${f.shots.length}</span>`:''}</div><div class="txt"><h3><span class="ic" style="background:${f.c}22">${svg(f.ic,f.c)}</span>${L('f.'+f.id+'.t')}</h3><p>${L('f.'+f.id+'.d')}</p></div></button>`}).join('');
 document.getElementById('docs-list').innerHTML=DOCS.map(d=>{const p=docPath(d[0]);return `<a class="doc" href="${REPO}/blob/main/${p}"><b>${L(d[1])}</b><span dir="ltr">${p.replace(/^docs\/(en\/)?/,'')}</span></a>`}).join('');
 fwLangDefault();buildHero();renderBoards();
}
// Hero slideshow
let heroI=0,heroTimer;
function buildHero(){
 const box=document.getElementById('heroScreen');
 box.innerHTML=HERO.map((n,i)=>`<img src="${shotSrc(n)}" ${shotFallback} alt="" class="${i===heroI?'on':''}">`).join('');
 document.getElementById('heroDots').innerHTML=HERO.map((_,i)=>`<button aria-label="${i+1}" class="${i===heroI?'on':''}" data-h="${i}"></button>`).join('');
}
function heroGo(i){
 heroI=(i+HERO.length)%HERO.length;
 document.querySelectorAll('#heroScreen img').forEach((im,k)=>im.classList.toggle('on',k===heroI));
 document.querySelectorAll('#heroDots button').forEach((b,k)=>b.classList.toggle('on',k===heroI));
 for(const [id,list] of [['heroOled',OLED],['heroGat',GAT]]){const im=document.getElementById(id);im.dataset.f='';im.src=shotSrc(list[heroI%list.length])}
}
function heroStart(){clearInterval(heroTimer);heroTimer=setInterval(()=>heroGo(heroI+1),3200)}
document.getElementById('heroDots').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(b){heroGo(+b.dataset.h);heroStart()}});
for(const id of ['heroOled','heroGat'])document.getElementById(id).addEventListener('error',e=>{const im=e.target;if(!im.dataset.f){im.dataset.f=1;im.src=im.src.replace(/-[a-z]+\.png$/,'-en.png')}});
// Lightbox
let lbF=null,lbI=0;
function lbShow(){
 const f=FEATURES[lbF],s=f.shots[lbI],img=document.getElementById('lbImg');
 img.dataset.f='';img.onerror=()=>{if(!img.dataset.f){img.dataset.f=1;img.src=img.src.replace(/-[a-z]+\.png$/,'-en.png')}};
 img.src=shotSrc(s,f.phone);img.alt=L('shot.'+s);
 img.classList.toggle('px',!f.phone);
 img.style.maxWidth=f.phone&&s!=='web-desktop'?'380px':'';
 document.getElementById('lbTitle').textContent=L('shot.'+s);
 document.getElementById('lbText').textContent=f.shots.length>1?`${L('f.'+f.id+'.t')} · ${lbI+1} / ${f.shots.length}`:L('f.'+f.id+'.t');
 document.getElementById('lbThumbs').innerHTML=f.shots.length>1?f.shots.map((t,i)=>`<button class="${i===lbI?'on':''}" data-t="${i}"><img src="${shotSrc(t,f.phone)}" ${shotFallback} alt=""></button>`).join(''):'';
 document.querySelectorAll('#lb .nav').forEach(n=>n.style.visibility=f.shots.length>1?'':'hidden');
}
function lbOpen(i){if(!FEATURES[i].shots.length)return;lbF=i;lbI=0;lbShow();document.getElementById('lb').classList.add('open');document.body.style.overflow='hidden'}
function lbClose(){document.getElementById('lb').classList.remove('open');document.body.style.overflow=''}
function lbStep(d){const n=FEATURES[lbF].shots.length;lbI=(lbI+d+n)%n;lbShow()}
document.getElementById('features-grid').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b)lbOpen(+b.dataset.f)});
document.getElementById('lb').addEventListener('click',e=>{
 if(e.target.closest('[data-close]')||e.target.id==='lb')return lbClose();
 const s=e.target.closest('[data-step]');if(s)return lbStep(+s.dataset.step);
 const t=e.target.closest('[data-t]');if(t){lbI=+t.dataset.t;lbShow()}
});
// Arrow keys follow the reading direction.
document.addEventListener('keydown',e=>{if(!document.getElementById('lb').classList.contains('open'))return;const r=document.documentElement.dir==='rtl'?-1:1;if(e.key==='Escape')lbClose();if(e.key==='ArrowRight')lbStep(r);if(e.key==='ArrowLeft')lbStep(-r)});
let touchX=null;
document.getElementById('lb').addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});
document.getElementById('lb').addEventListener('touchend',e=>{if(touchX==null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>50)lbStep(dx<0?1:-1);touchX=null});
// Boards and installer
let BOARDS=[],board='m9';
const SUB=['gat562_30s','m9','heltec_v4','heltec_v4_r8','tdeck'];
// The device language: the site's unless the visitor picked another; ESP32 boards get the partition table
// with it (firmware/<env>/manifest-<code>.json), nRF52 boards the image with that language, patched (nrf52 module below).
let fwLangPicked=false;
const fwLang=()=>document.getElementById('fwLang').value;
function fwLangDefault(){if(!fwLangPicked)document.getElementById('fwLang').value=lang;}
function renderBoards(){
 const box=document.getElementById('boards');
 if(!BOARDS.length){box.innerHTML='';return}
 const card=b=>`<button class="board${b.env===board?' on':''}" data-b="${b.env}"><span class="radio"></span><span><b>${b.name}</b><small>${SUB.includes(b.env)?L('sub.'+b.env):`${b.chip} · ${b.flash}`}</small></span></button>`;
 box.innerHTML=`<h4><span class="tag ok">✓</span>${L('boards.verified')}</h4><div class="bg">${BOARDS.filter(b=>b.verified).map(card).join('')}</div>`
  +`<h4><span class="tag cm">β</span>${L('boards.beta')}</h4><div class="bg">${BOARDS.filter(b=>!b.verified).map(card).join('')}</div>`;
 const b=BOARDS.find(x=>x.env===board)||BOARDS[0];
 // nRF52 boards install by copying a UF2 file to the bootloader drive, not over Web Serial.
 const uf2=b.install==='uf2';
 document.getElementById('installer').style.display=uf2?'none':'';document.getElementById('espSteps').hidden=uf2;
 document.getElementById('nrfInstall').hidden=!uf2||!b.dfu;document.getElementById('uf2Note').hidden=!uf2;if(window.nrfReset)window.nrfReset();
 for(const e of document.querySelectorAll('.esp-only'))e.style.display=uf2?'none':'';document.getElementById('uf2Steps').hidden=!uf2;document.getElementById('uf2').hidden=!uf2;
 if(uf2)document.getElementById('uf2').href=b.uf2;else document.getElementById('installer').setAttribute('manifest',b.langs?`firmware/${b.env}/manifest-${fwLang()}.json`:`firmware/${b.env}/manifest.json`);
 document.getElementById('zip').href=b.zip;
 document.getElementById('chosenName').textContent=b.name;
 document.getElementById('chosenInfo').textContent=`MeshMesh ${VERSION} · ${b.chip} · ${b.flash}`;
 const tag=document.getElementById('chosenTag');
 tag.className='tag '+(b.verified?'ok':'cm');tag.textContent=b.verified?L('tag.verified'):L('tag.unverified');
 document.getElementById('communityNote').hidden=b.verified;
}
document.getElementById('boards').addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(b){board=b.dataset.b;renderBoards()}});
for(const id of ['siteLang','fwLang'])document.getElementById(id).innerHTML=LANGS.map(([c,n])=>`<option value="${c}" lang="${c}">${n}</option>`).join('');
document.getElementById('siteLang').addEventListener('change',e=>setLang(e.target.value,true));
document.getElementById('fwLang').addEventListener('change',()=>{fwLangPicked=true;renderBoards()});
let VERSION='';
fetch('firmware/boards.json').then(r=>r.json()).then(j=>{VERSION=j.version;BOARDS=j.boards;document.getElementById('ver').textContent=j.version;renderBoards()}).catch(()=>{document.getElementById('boards').innerHTML=`<p class="unsup">${L('boards.publishing')}</p>`});
setLang(pickLang(),false).then(heroStart);
setTimeout(()=>document.documentElement.classList.remove('loading'),2500); // never stay hidden
</script>
<script type="module">
// nRF52 boards (GAT562): install over Web Serial with the bootloader's serial DFU (site/nrf52dfu.js).
import {dfuFlash,touch1200,webSerialIo,isBootloader,withLanguage,uf2WithLanguage} from './nrf52dfu.js';
const el=id=>document.getElementById(id),T=k=>L(k);
let continuing=false;
function label(next){continuing=next;el('nrfLabel').innerHTML='<span>'+T(next?'nrf.continue':'btn.install')+'</span>';}
function say(text,cls='',progress=null){const s=el('nrfStatus');s.hidden=false;s.className='note '+cls;el('nrfText').textContent=text;const p=el('nrfProgress');p.hidden=progress===null;if(progress!==null)p.value=progress;}
window.nrfReset=()=>{el('nrfStatus').hidden=true;label(false);};
// 1 MB flash: English and Russian in every image, each other language in its own (lang_images).
const image=(b,code)=>b.lang_images&&b.lang_images[code]||{bin:b.dfu&&b.dfu.bin,dat:b.dfu&&b.dfu.dat,uf2:b.uf2};
async function files(b){const get=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.arrayBuffer()}).then(a=>new Uint8Array(a));const i=image(b,fwLang());return Promise.all([get(i.bin),get(i.dat)]);}
el('nrfInstall').addEventListener('click',async()=>{
 const b=BOARDS.find(x=>x.env===board)||BOARDS[0],btn=el('nrfInstall');
 if(!b||!b.dfu)return;
 if(!('serial' in navigator)){say(T('nrf.noSerial'),'warn');return;}
 btn.disabled=true;
 try{
  const port=await navigator.serial.requestPort({filters:[{usbVendorId:0x239a}]});
  if(!isBootloader(port)){
   say(T('nrf.toBootloader'));await touch1200(port);
   label(true);say(T('nrf.inBootloader'));return;}
  label(false);say(T('nrf.downloading'),'',0);
  const [raw,rawDat]=await files(b);const [bin,dat]=withLanguage(raw,rawDat,fwLang());const io=await webSerialIo(port);
  try{await dfuFlash(io,bin,dat,(part,stage)=>say(stage==='erase'?T('nrf.erasing'):stage==='done'?T('nrf.written'):T('nrf.writing')+Math.round(part*100)+'%','',part));}
  finally{await io.close();}
  say(T('nrf.done')+VERSION+'.','ok',null);
 }catch(e){if(e.name==='NotFoundError'){if(!continuing)el('nrfStatus').hidden=true;}else say(T('nrf.error')+e.message+T('nrf.retry'),'warn');}
 finally{btn.disabled=false;}
});
// firmware.uf2 for the bootloader drive, with the chosen device language.
el('uf2').addEventListener('click',async e=>{
 const b=BOARDS.find(x=>x.env===board);if(!b||!b.uf2||e.currentTarget.dataset.ready)return;
 e.preventDefault();const a=e.currentTarget;
 try{const r=await fetch(image(b,fwLang()).uf2);if(!r.ok)throw new Error(r.url+' '+r.status);const raw=new Uint8Array(await r.arrayBuffer());
  const url=URL.createObjectURL(new Blob([uf2WithLanguage(raw,fwLang())],{type:'application/octet-stream'}));
  a.href=url;a.dataset.ready=1;a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.href=b.uf2;delete a.dataset.ready},4000);
 }catch(err){say(T('nrf.error')+err.message,'warn');}
});
</script>
