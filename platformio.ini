[platformio]
default_envs = m9

[env:m9]
platform = platformio/espressif32@6.11.0
framework = arduino
board = meshmesh_m9
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<*> -<nrf52/> -<HardwareHeltec.cpp> -<HardwareCompact.cpp> -<HardwareTDeck.cpp> -<UiHeltec.cpp>
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D BOARD_HAS_PSRAM
  -D MAX_CONTACTS=24
  -D MAX_GROUP_CHANNELS=8
  -D ENV_INCLUDE_GPS=1
  -D CORE_DEBUG_LEVEL=0
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
lib_deps =
  rweather/Crypto@0.4.0
  jgromes/RadioLib@7.8.1
  adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
  olikraus/U8g2_for_Adafruit_GFX@1.8.0
  mikalhart/TinyGPSPlus@1.0.3
  adafruit/RTClib@2.1.4
  bblanchon/ArduinoJson@6.21.5
  h2zero/NimBLE-Arduino@1.4.3


[env:heltec_v4]
extends = env:m9
board = meshmesh_heltec_v4
build_unflags = ${env:m9.build_unflags} -D ARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -std=gnu++17
  -D MM_HELTEC_V4=1
  -D MM_COMPACT=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM
  -D MAX_CONTACTS=24
  -D MAX_GROUP_CHANNELS=8
  -D ENV_INCLUDE_GPS=1
  -D CORE_DEBUG_LEVEL=0
  -D RADIOLIB_STATIC_ONLY=1
build_src_filter = +<*> -<nrf52/> -<Hardware.cpp> -<HardwareCompact.cpp> -<HardwareTDeck.cpp> -<Ui.cpp> -<Solitaire.cpp>
lib_deps =
  ${env:m9.lib_deps}
  adafruit/Adafruit SSD1306@2.5.15

[env:heltec_v4_r8]
extends = env:heltec_v4
board = meshmesh_heltec_v4_r8
build_flags = ${env:heltec_v4.build_flags} -D MM_HELTEC_R8=1

; Community boards: built and packaged here, checked on the hardware by their owners.
; Pins and power rails follow the boards' MeshCore variants (upstream/meshcore/variants).
; One-button boards share the Heltec interface (UiHeltec.cpp) and HardwareCompact.cpp.
[compact]
extends = env:m9
build_src_filter = +<*> -<nrf52/> -<Hardware.cpp> -<HardwareHeltec.cpp> -<HardwareTDeck.cpp> -<Ui.cpp> -<Solitaire.cpp>
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D MM_COMPACT=1
  -D MAX_CONTACTS=24
  -D MAX_GROUP_CHANNELS=8
  -D ENV_INCLUDE_GPS=1
  -D CORE_DEBUG_LEVEL=0
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
lib_deps =
  ${env:m9.lib_deps}
  adafruit/Adafruit SSD1306@2.5.15
  adafruit/Adafruit SH110X@2.1.13

[env:heltec_v3]
extends = compact
board = meshmesh_heltec_v3
board_build.partitions = partitions-8mb.csv
build_flags = ${compact.build_flags} -D MM_BOARD_HELTEC_V3=1 -D MM_PANEL_SSD1306=1

[env:heltec_tracker]
extends = compact
board = meshmesh_heltec_tracker
board_build.partitions = partitions-8mb.csv
build_flags = ${compact.build_flags} -D MM_BOARD_HELTEC_TRACKER=1 -D MM_PANEL_ST7735=1

[env:tbeam]
extends = compact
board = meshmesh_tbeam
board_build.partitions = partitions-4mb.csv
build_flags = ${compact.build_flags} -D MM_BOARD_TBEAM=1 -D MM_PANEL_SSD1306=1 -D MM_PMU=1
lib_deps =
  ${compact.lib_deps}
  lewisxhe/XPowersLib@0.2.7

[env:tbeam_supreme]
extends = compact
board = meshmesh_tbeam_supreme
board_build.partitions = partitions-8mb.csv
build_flags = ${compact.build_flags} -D MM_BOARD_TBEAM_SUPREME=1 -D MM_PANEL_SH1106=1 -D MM_PMU=1
lib_deps =
  ${compact.lib_deps}
  lewisxhe/XPowersLib@0.2.7

[env:t3s3]
extends = compact
board = meshmesh_t3s3
board_build.partitions = partitions-4mb.csv
build_flags = ${compact.build_flags} -D MM_BOARD_T3S3=1 -D MM_PANEL_SSD1306=1

[env:tlora_v2_1_6]
extends = compact
board = meshmesh_tlora_v2_1_6
board_build.partitions = partitions-4mb.csv
build_flags = ${compact.build_flags} -D MM_BOARD_TLORA=1 -D MM_PANEL_SSD1306=1

[env:xiao_s3_wio]
extends = compact
board = meshmesh_xiao_s3_wio
board_build.partitions = partitions-8mb.csv
build_flags = ${compact.build_flags} -D MM_BOARD_XIAO_S3=1

[env:station_g2]
extends = compact
board = meshmesh_station_g2
build_flags = ${compact.build_flags} -D MM_BOARD_STATION_G2=1 -D MM_PANEL_SH1106=1

[env:thinknode_m2]
extends = compact
board = meshmesh_thinknode_m2
board_build.partitions = partitions-4mb.csv
build_flags = ${compact.build_flags} -D MM_BOARD_THINKNODE_M2=1 -D MM_PANEL_SH1106=1

; T-Deck: the M9 interface (Ui.cpp) with its keyboard and trackball.
[env:tdeck]
extends = env:m9
board = meshmesh_tdeck
build_src_filter = +<*> -<nrf52/> -<Hardware.cpp> -<HardwareHeltec.cpp> -<HardwareCompact.cpp> -<UiHeltec.cpp>
build_flags =
  -std=gnu++17
  -D MM_BOARD_TDECK=1
  -D MAX_CONTACTS=24
  -D MAX_GROUP_CHANNELS=8
  -D ENV_INCLUDE_GPS=1
  -D CORE_DEBUG_LEVEL=0
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1

; GAT562 30S Mesh Kit: nRF52840 + SX1262 with a ~30 dBm power amplifier, 1.3" OLED, five-way
; joystick and a back button. No Wi-Fi: Bluetooth (the app) and USB carry the device page.
; Adafruit nRF52 core: the MeshCore fork with the BLE stack lockup fix (MeshCore PR 1177/1295).
; Flash: SoftDevice S140 6.1.1, application 0x26000-0xD4000, MeshMesh LittleFS 0xD4000-0xED000;
; the stock MeshCore InternalFS (0xED000-0xF4000) is left untouched.
[env:gat562_30s]
platform = nordicnrf52@11.0.0
platform_packages =
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301
framework = arduino
board = meshmesh_gat562_30s
board_build.ldscript = boards/nrf52840_s140_v6_meshmesh.ld
build_src_filter = +<*> -<Hardware.cpp> -<HardwareHeltec.cpp> -<HardwareCompact.cpp> -<HardwareTDeck.cpp> -<Ui.cpp> -<Solitaire.cpp>
  -<Portal.cpp> -<Radar.cpp> -<RadarCsi.cpp> -<Internet.cpp> -<Maps.cpp> -<MapPng.cpp> -<WifiDiagnostics.cpp> -<BleDiagnostics.cpp>
; -Ofast (the core default) unrolls the Curve25519/Ed25519 code to ~640 KB; -O2 keeps it small.
build_unflags = -std=gnu++11 -Ofast
build_flags =
  -std=gnu++17
  -O2
  -I src/nrf52/compat
  -D MM_NRF52=1
  -D MM_COMPACT=1
  -D MM_BOARD_GAT562=1
  -D MM_PANEL_SSD1306=1
  -D NRF52_PLATFORM=1
  -D LFS_NO_ASSERT=1
  -D MAX_CONTACTS=24
  -D MAX_GROUP_CHANNELS=8
  -D ENV_INCLUDE_GPS=1
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_SX127X=1
lib_deps =
  rweather/Crypto@0.4.0
  jgromes/RadioLib@7.8.1
  olikraus/U8g2_for_Adafruit_GFX@1.8.0
  mikalhart/TinyGPSPlus@1.0.3
  adafruit/RTClib@2.1.4
  bblanchon/ArduinoJson@6.21.5
  adafruit/Adafruit SSD1306@2.5.15
