# Builds every board, the Android app and the site, then publishes them to GitHub Pages.
name: Site and firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python tools/version.py --check
          python tools/version_check.py
          python tools/i18n.py check
          python tools/networks.py check
          node tools/chess/i18n_check.cjs
          npm ci --prefix tools
          node tools/web_i18n.cjs check

  firmware:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        env: [m9, heltec_v4, heltec_v4_r8, heltec_v3, heltec_tracker, tdeck, tbeam, tbeam_supreme, t3s3, tlora_v2_1_6, xiao_s3_wio, station_g2, thinknode_m2, heltec_e213, gat562_30s, heltec_t114, heltec_t096, faketec]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-
      - run: pip install platformio esptool
      - run: pio run -e ${{ matrix.env }}
      - run: python tools/package.py ${{ matrix.env }}
      # The screens in every interface language for the site (host build of the UI; needs the m9 libraries).
      # Required: do not silently publish old screenshots when generation fails.
      - if: matrix.env == 'm9'
        run: pip install pillow && python tools/site_shots.py artifacts/site-shots
      # Checkers and sea battle: two host copies of src/Duel.cpp play whole games, with lost messages resent.
      - if: matrix.env == 'm9'
        run: KEEP=/tmp/duelsrv sh tools/ui_preview/build.sh m9 /tmp/duel-preview en && python tools/duel_check.py /tmp/duelsrv --games 4
      # The device page in every language (made-up data, headless Chrome of the runner).
      - if: matrix.env == 'm9'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk
          CHROME=$(command -v google-chrome) python tools/web_shots.py artifacts/web-shots
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.env }}
          path: artifacts/

  android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        working-directory: android
        env:
          MM_KEYSTORE_BASE64: ${{ secrets.MM_KEYSTORE_BASE64 }}
          MM_KEYSTORE_PASSWORD: ${{ secrets.MM_KEYSTORE_PASSWORD }}
        run: |
          test -n "$MM_KEYSTORE_BASE64" && test -n "$MM_KEYSTORE_PASSWORD"
          umask 077
          echo "$MM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MM_KEYSTORE="$RUNNER_TEMP/release.jks"
          export MM_VERSION_CODE=$(python ../tools/version.py --android-code)
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/output-metadata.json

  site:
    needs: [firmware, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - run: python tools/i18n.py check
      - run: |
          python tools/pages.py _site m9 heltec_v4 gat562_30s heltec_t114 heltec_v4_r8 heltec_v3 heltec_tracker tdeck tbeam tbeam_supreme t3s3 tlora_v2_1_6 xiao_s3_wio station_g2 thinknode_m2 heltec_e213 heltec_t096 faketec
          mkdir -p _site/app && cp apk/app-release.apk _site/app/meshmesh.apk
          # The app checks app/version.json and downloads the numbered copy (a fresh name, no stale CDN cache).
          python tools/app_release.py _site/app apk/output-metadata.json
          python tools/publish_check.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only the current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = "$GITHUB_SHA"
      - id: deployment
        uses: actions/deploy-pages@v4
